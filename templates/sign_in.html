<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordzzle - Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sign_in.css') }}">
</head>
<body>
    <div class="login-container">
        <h2>Sign In</h2>
        <form action="/login" method="POST">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="Enter your name" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>

            <div class="signup-link">
                <a href="{{ url_for('signup') }}">Don't have an account? Sign Up</a>
            </div>
        </form>
    </div>
</body>
</html>
