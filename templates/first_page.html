<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Search Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('bk.jpg') no-repeat center center/cover;
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 90%;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-login {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
        }
        .btn-signup {
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            color: white;
        }
        .btn-play {
            background: linear-gradient(135deg, #0f9b0f, #00c853);
            color: white;
        }
        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RACE THE WORDS</h1>
        <p>Find hidden words and challenge your mind! Play now and enjoy the fun.</p>
        <button class="btn btn-login" onclick="location.href='sign_in.html'">Login</button>
        <button class="btn btn-signup" onclick="location.href='sign_up.html'">Sign Up</button>
        <button class="btn btn-play" onclick="location.href='???'">Play Without Logging In</button>
    </div>
</body>
</html>
