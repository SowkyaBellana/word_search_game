<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordzzle - Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sign_up.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="signup-container">
        <div class="logo">
            <h1 class="logo-text">WORDZZLE</h1>
        </div>
        <form action="/signup" method="POST">
            <h2>Create Account</h2>
            
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" placeholder="Enter your name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="play-btn">Sign Up</button>
        
            <div class="auth-link">
                Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
            </div>
        </form>
    </div>
</body>
</html>
