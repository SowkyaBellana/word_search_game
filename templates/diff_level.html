<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Difficulty</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/diff_level.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2>Topic: <span class="highlight">{{ topic }}</span></h2>
        <h3>Difficulty Level</h3>

        <div class="difficulty-options">
            <form action="/start-game" method="POST">
                <input type="hidden" name="topic" value="{{ topic }}">
                <input type="hidden" name="difficulty" value="Easy">
                <button type="submit" class="circle easy">Easy</button>
            </form>
            <form action="/start-game" method="POST">
                <input type="hidden" name="topic" value="{{ topic }}">
                <input type="hidden" name="difficulty" value="Medium">
                <button type="submit" class="circle medium">Medium</button>
            </form>
            <form action="/start-game" method="POST">
                <input type="hidden" name="topic" value="{{ topic }}">
                <input type="hidden" name="difficulty" value="Hard">
                <button type="submit" class="circle hard">Hard</button>
            </form>
        </div>
    </div>
</body>
</html>
